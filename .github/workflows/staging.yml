name: Staging

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  Build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        env:
          DEPLOY_TARGET: staging
        run: |
          pnpm run build
          mkdir deploy
          mv public/firebase.json deploy/
          mv public deploy/

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-art
          path: deploy

  Deploy:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'mohatt') }}
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-art

      - name: Deploy to live channel
        if: github.event_name == 'push'
        run: echo "DEPLOY_CHANNEL=live" >> $GITHUB_ENV

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOHATT_STAGING }}
          projectId: mohatt-staging
          channelId: ${{ env.DEPLOY_CHANNEL }}
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
