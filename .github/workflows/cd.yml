name: CD

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]

# Cancel older runs per branch
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    # For push: run only if the commit message doesn’t contain [skip ci]
    # For PR: run only if the PR author is mohatt (to avoid bot prs)
    if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'mohatt') }}
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Select target (prod/staging)
        id: target
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }} # The branch being pushed to (for pushes)
          BASE_REF: ${{ github.base_ref }} # The PR’s target branch (for pull requests)
        run: |
          # For PRs, route by base branch; for pushes, by the ref itself
          TARGET_BRANCH="${BASE_REF:-$REF_NAME}"

          if [[ "$TARGET_BRANCH" == "production" ]]; then
            ENV_NAME="production"
            PROJECT_ID="mohatt"
            SA_SECRET="FIREBASE_SERVICE_ACCOUNT_MOHATT"
          else
            ENV_NAME="staging"
            PROJECT_ID="mohatt-staging"
            SA_SECRET="FIREBASE_SERVICE_ACCOUNT_MOHATT_STAGING"
          fi

          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "sa_secret=$SA_SECRET" >> $GITHUB_OUTPUT

      - name: Install firebase & GCP credentials
        env:
          SA_JSON: ${{ secrets[steps.target.outputs.sa_secret] }}
        run: |
          pnpm i -g firebase-tools
          echo "$SA_JSON" > "${RUNNER_TEMP}/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/sa.json" >> $GITHUB_ENV

      - name: Setup deploy channel
        id: channel
        shell: bash
        env:
          PROJECT_ID: ${{ steps.target.outputs.project_id }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }} # The PR’s source branch (for pull requests)
          REF_NAME: ${{ github.ref_name }} # The branch being pushed to (for pushes)
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            CHANNEL="live"
            BASE_URL="https://${PROJECT_ID}.web.app"
          else
            BRANCH="${HEAD_REF:-$REF_NAME}"
            SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g' | sed -E 's/^-+|-+$//g' | cut -c1-12)          
            CHANNEL="pr-${PR_NUMBER}-${SLUG}"

            # Create channel if missing (idempotent)
            echo "firebase hosting:channel:create"
            firebase --project "$PROJECT_ID" hosting:channel:create "$CHANNEL" || true

            # Ask CLI for the exact preview URL (stable per-channel)
            echo "firebase hosting:channel:open"
            URL_JSON=$(firebase --project "$PROJECT_ID" hosting:channel:open "$CHANNEL" --json)
            BASE_URL=$(echo "$URL_JSON" | jq -r '.result.url')
          fi

          echo "deploy_channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "deploy_url=$BASE_URL" >> $GITHUB_OUTPUT
          echo "deploy_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log metadata
        run: |
          echo "::group::Deploy metadata"
          echo "Event:      ${{ github.event_name }}"
          echo "Env:        ${{ steps.target.outputs.env_name }}"
          echo "Project:    ${{ steps.target.outputs.project_id }}"
          echo "Channel:    ${{ steps.channel.outputs.deploy_channel }}"
          echo "PreviewURL: ${{ steps.channel.outputs.deploy_url }}"
          echo "::endgroup::"

      - name: Check maintenance mode
        id: maintenance
        run: |
          FLAG_FILE="maintenance/.maintenance"
          if [[ -f "$FLAG_FILE" ]]; then
            FLAG=$(tr '[:upper:]' '[:lower:]' < "$FLAG_FILE" | tr -d '[:space:]')
          else
            FLAG="off"
          fi
          if [[ "$FLAG" == "1" || "$FLAG" == "true" || "$FLAG" == "on" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Maintenance mode enabled — skipping app build"
            cp -a maintenance deploy
            ls -la deploy
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: ${{ steps.maintenance.outputs.enabled == 'false' }}
        run: pnpm install

      - name: Build
        if: ${{ steps.maintenance.outputs.enabled == 'false' }}
        env:
          DEPLOY_TARGET: ${{ steps.target.outputs.env_name }}
          DEPLOY_CHANNEL: ${{ steps.channel.outputs.deploy_channel }}
          DEPLOY_URL: ${{ steps.channel.outputs.deploy_url }}
          DEPLOY_SHA: ${{ steps.channel.outputs.deploy_sha }}
        run: |
          pnpm run build
          mkdir deploy
          mv public/firebase.json deploy/
          cp -r public deploy/

      - id: deploy
        name: Deploy (${{ steps.channel.outputs.deploy_channel }})
        working-directory: deploy
        env:
          PROJECT_ID: ${{ steps.target.outputs.project_id }}
          EVENT_NAME: ${{ github.event_name }}
          FIREBASE_CLI_PREVIEWS: hostingchannels
          DEPLOY_CHANNEL: ${{ steps.channel.outputs.deploy_channel }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            firebase --project "$PROJECT_ID" deploy --only hosting
          else
            firebase --project "$PROJECT_ID" hosting:channel:deploy "$DEPLOY_CHANNEL" --expires 7d
          fi

      # For debugging build artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-files
          path: deploy

      - name: Add job summary
        run: |
          echo "- Environment: **${{ steps.target.outputs.env_name }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Project: **${{ steps.target.outputs.project_id }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Channel: \`${{ steps.channel.outputs.deploy_channel }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ steps.channel.outputs.deploy_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Maintenance: \`${{ steps.maintenance.outputs.enabled }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Comment preview on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-deploy
          message: |
            ### 🚀 Preview Deploy
            - **Environment:** `${{ steps.target.outputs.env_name }}`
            - **Project:** `${{ steps.target.outputs.project_id }}`
            - **Channel:** `${{ steps.channel.outputs.deploy_channel }}`
            - **URL:** ${{ steps.channel.outputs.deploy_url }}
            - **Commit:** ${{ github.sha }}
            - **Maintenance:** `${{ steps.maintenance.outputs.enabled }}`

            ### 📊 Lighthouse Reports
            ⏳ Please wait while Lighthouse reports are generated…

            _(This comment updates on each PR deploy)_

      - name: Run Lighthouse Tests (Local)
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        id: lhci
        with:
          configPath: './.lighthouserc.js'
          temporaryPublicStorage: true

      - name: Run Lighthouse Tests (Live)
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        id: lhci-live
        with:
          urls: |
            ${{ steps.channel.outputs.deploy_url }}
            ${{ steps.channel.outputs.deploy_url }}/projects/
            ${{ steps.channel.outputs.deploy_url }}/resume/
          configPath: './.lighthouserc-live.js'
          temporaryPublicStorage: true

      - name: Format Lighthouse links
        id: lhci-format
        run: |
          {
            echo "formatted<<EOF"
            echo "#### Local (static build)"
            echo '${{ steps.lhci.outputs.links }}' \
              | jq -r 'to_entries | map("**\(.key)**\n[\(.value)](\(.value))") | join("\n\n")'
            echo ""
            echo "#### Live (deployed URL)"
            echo '${{ steps.lhci-live.outputs.links }}' \
              | jq -r 'to_entries | map("**\(.key)**\n[\(.value)](\(.value))") | join("\n\n")'
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Final Comment preview on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-deploy
          message: |
            ### 🚀 Preview Deploy
            - **Environment:** `${{ steps.target.outputs.env_name }}`
            - **Project:** `${{ steps.target.outputs.project_id }}`
            - **Channel:** `${{ steps.channel.outputs.deploy_channel }}`
            - **URL:** ${{ steps.channel.outputs.deploy_url }}
            - **Commit:** ${{ github.sha }}
            - **Maintenance:** `${{ steps.maintenance.outputs.enabled }}`

            ### 📊 Lighthouse Reports
            ${{ steps.lhci-format.outputs.formatted }}

            _(This comment updates on each PR deploy)_
